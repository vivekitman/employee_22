<div class="app-shell">
	<aside class="side-nav" aria-label="Main navigation">
		<div class="brand-lockup">
			<div class="brand-mark" aria-hidden="true">
				<span></span>
				<span></span>
				<span></span>
			</div>
			<div>
				<strong>Employee</strong>
				<span>22 workspace</span>
			</div>
		</div>

		<div class="nav-section-label">Workspace</div>
		<nav class="nav-links">
			<a class="nav-link active" routerLink="/emp-list" routerLinkActive="active">
				<span class="nav-icon" aria-hidden="true">&#9638;</span>
				<span>Employees</span>
			</a>
			<a class="nav-link" routerLink="/emp-form" routerLinkActive="active">
				<span class="nav-icon" aria-hidden="true">&#43;</span>
				<span>Add employee</span>
			</a>
			<a class="nav-link" routerLink="/master" routerLinkActive="active">
				<span class="nav-icon" aria-hidden="true">&#9881;</span>
				<span>Master data</span>
			</a>
		</nav>

		<div class="nav-divider"></div>
		<div class="nav-section-label">Manage</div>
		<nav class="nav-links">
			<a class="nav-link" routerLink="/reports" routerLinkActive="active">
				<span class="nav-icon" aria-hidden="true">&#9641;</span>
				<span>Reports</span>
			</a>
			<a class="nav-link" routerLink="/settings" routerLinkActive="active">
				<span class="nav-icon" aria-hidden="true">&#9881;</span>
				<span>Settings</span>
			</a>
		</nav>

		<div class="nav-bottom">
			<div class="help-card">
				<span class="help-spark" aria-hidden="true">?</span>
				<div>
					<strong>Need a hand?</strong>
					<span>Visit the help centre</span>
				</div>
				<span class="help-arrow" aria-hidden="true">&#8599;</span>
			</div>

			<div class="user-profile">
				<div class="avatar" aria-hidden="true"> {{loggedUser.employeeName.charAt(0)}}   </div>
				<div class="user-details">
					<strong>{{loggedUser.employeeName}}</strong>
					<span>{{loggedUser.role}}</span>
				</div>
				<button class="logout-button" type="button" (click)="onlogoff()" aria-label="Log off" title="Log off">
					<span aria-hidden="true">&#8594;</span>
				</button>
			</div>
		</div>
	</aside>

	<main class="main-content">
		<header class="content-header">
			<div>
				<p class="content-kicker">People operations</p>
				<h1>Good morning, Alex <span aria-hidden="true">✦</span></h1>
			</div>
			<div class="header-status"><span></span> System online</div>
		</header>

		<section class="page-frame">
			<router-outlet></router-outlet>
		</section>
	</main>
</div>
